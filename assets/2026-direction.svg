<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">codebynv 2026 Character Development Arc</title><desc id="desc">A playful game-style 2026 roadmap showing skills, projects, personal growth, public proof and career goals without overlapping content.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101414"/><stop offset=".5" stop-color="#18211d"/><stop offset="1" stop-color="#0b0e0d"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1c2722"/><stop offset="1" stop-color="#111815"/></linearGradient><linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#65e6a1"/><stop offset="1" stop-color="#c9e66f"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffe09a"/><stop offset="1" stop-color="#eab75b"/></linearGradient><radialGradient id="glow"><stop stop-color="#66e6a4" stop-opacity=".20"/><stop offset="1" stop-color="#66e6a4" stop-opacity="0"/></radialGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".55"/></filter><filter id="glowf"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.mono{font:700 10px monospace;letter-spacing:2px}.h1{font:800 34px Arial,sans-serif}.h2{font:800 15px Arial,sans-serif}.body{font:500 11px Arial,sans-serif}.small{font:700 9px monospace;letter-spacing:1.4px}.white{fill:#f7faf6}.muted{fill:#aab8af}.green{fill:#72e9aa}.gold{fill:#f5ce79}.line{stroke:#3d5549}.float{animation:f 4s ease-in-out infinite}.pulse{animation:p 1.8s ease-in-out infinite}@keyframes f{50%{transform:translateY(-3px)}}@keyframes p{50%{opacity:.35}}</style></defs><rect width="1200" height="620" rx="30" fill="url(#bg)"/><circle cx="600" cy="310" r="300" fill="url(#glow)"/>
