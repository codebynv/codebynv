<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">codebynv 2026 Direction</title><desc id="desc">Futuristic 3D-style roadmap for Nirav Vala showing consistency, skills, projects, career, impact and freedom, surrounded by AI, full-stack, technology exploration, personal growth, creation and life goals.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d18"/><stop offset="1" stop-color="#17213b"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45d9ff"/><stop offset="1" stop-color="#5c67f2"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe18a"/><stop offset="1" stop-color="#ff9f43"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".13"/><stop offset="1" stop-color="#ffffff" stop-opacity=".035"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-opacity=".5"/></filter><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.h{font:700 20px Arial,sans-serif;fill:#f7f9ff}.t{font:500 13px Arial,sans-serif;fill:#b9c6df}.m{font:600 11px monospace;fill:#7187b4}.s{font:700 15px Arial,sans-serif;fill:#fff}.ss{font:500 11px Arial,sans-serif;fill:#aab8d2}.flow{fill:none;stroke:#4fd9ff;stroke-width:4;stroke-linecap:round;stroke-dasharray:8 12;animation:f 2.4s linear infinite}.float{animation:u 4s ease-in-out infinite}.pulse{animation:p 2s ease-in-out infinite}@keyframes f{to{stroke-dashoffset:-80}}@keyframes u{50%{transform:translateY(-6px)}}@keyframes p{50%{opacity:.35;filter:url(#glow)}}</style></defs><rect width="1200" height="620" rx="30" fill="url(#bg)"/><g opacity=".13"><circle cx="600" cy="315" r="235" fill="none" stroke="#4fd9ff" stroke-dasharray="3 16"/><circle cx="600" cy="315" r="185"