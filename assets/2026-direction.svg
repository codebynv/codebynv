<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">codebynv 2026 Direction</title><desc id="desc">A premium dark emerald and gold roadmap for codebynv's 2026 direction, focused on learning, building, proof, opportunity and impact.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b0b"/><stop offset=".42" stop-color="#101915"/><stop offset=".75" stop-color="#07100d"/><stop offset="1" stop-color="#0b0a08"/></linearGradient><radialGradient id="greenGlow"><stop stop-color="#39d98a" stop-opacity=".26"/><stop offset="1" stop-color="#39d98a" stop-opacity="0"/></radialGradient><radialGradient id="goldGlow"><stop stop-color="#f5c76d" stop-opacity=".20"/><stop offset="1" stop-color="#f5c76d" stop-opacity="0"/></radialGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".105"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".045"/><stop offset="1" stop-color="#ffffff" stop-opacity=".018"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65f0ad"/><stop offset=".55" stop-color="#c8ec91"/><stop offset="1" stop-color="#f1c86a"/></linearGradient><linearGradient id="energy" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#4be89a"/><stop offset=".55" stop-color="#b8ec8c"/><stop offset="1" stop-color="#ffd47a"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="17" flood-color="#000" flood-opacity=".60"/></filter><filter id="soft"><feGaussianBlur stdDeviation="28"/></filter><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.ey{font:700 10px monospace;letter-spacing:2.4px;fill:#9bad9e}.title{font:800 38px Arial,sans-serif;fill:#fbfcf7}.sub{font:500 13px Arial,sans-serif;fill:#bac5ba}.cardh{font:800 14px Arial,sans-serif;fill:#f6f8f2}.cardt{font:500 11px Arial,sans-serif;fill:#b1bcb2}.step{font:800 13px Arial,sans-serif;fill:#f8faf5}.step2{font:500 10px Arial,sans-serif;fill:#99aa9d}.flow{fill:none;stroke:url(#energy);stroke-width:5;stroke-linecap:round;stroke-dasharray:7 11;filter:url(#glow);animation:f 2.2s linear infinite}.orbit{fill:none;stroke:#82978a;stroke-width:1.1;stroke-dasharray:2 11;opacity:.28}.float{animation:u 4.8s ease-in-out infinite}.pulse{animation:p 2s ease-in-out infinite}@keyframes f{to{stroke-dashoffset:-72}}@keyframes u{50%{transform:translateY(-4px)}}@keyframes p{50%{opacity:.38}}</style></defs>
