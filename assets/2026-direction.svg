ial,sans-serif;fill:#b1bdb3}.step{font:800 13px Arial,sans-serif;fill:#f8faf5}.step2{font:500 10px Arial,sans-serif;fill:#96a89b}.flow{fill:none;stroke:url(#energy);stroke-width:4.5;stroke-linecap:round;stroke-dasharray:7 10;filter:url(#glow);animation:f 2.2s linear infinite}.orbit{fill:none;stroke:#82968a;stroke-width:1.05;stroke-dasharray:2 12;opacity:.22}.float{animation:u 5s ease-in-out infinite}.pulse{animation:p 2s ease-in-out infinite}@keyframes f{to{stroke-dashoffset:-68}}@keyframes u{50%{transform:translateY(-3px)}}@keyframes p{50%{opacity:.34}}</style></defs>
